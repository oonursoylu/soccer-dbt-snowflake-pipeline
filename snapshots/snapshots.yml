version: 2

snapshots:
  - name: snp_player_attributes
    description: "SCD Type 2 snapshot table for player attribute rows, preserving changes across repeated warehouse loads."
    columns:
      - name: dbt_scd_id
        tests:
          - unique
          - not_null
      - name: player_id
        tests:
          - not_null
      - name: attribute_pk
        tests:
          - not_null
      - name: dbt_valid_from
        tests:
          - not_null

  - name: snp_player_profiles
    description: "SCD Type 2 snapshot table for player profile rows, preserving changes to physical profile fields."
    columns:
      - name: dbt_scd_id
        tests:
          - unique
          - not_null
      - name: player_id
        tests:
          - not_null

  - name: snp_team_attributes
    description: "SCD Type 2 snapshot table for team tactical attribute rows, preserving changes across repeated warehouse loads."
    columns:
      - name: dbt_scd_id
        tests:
          - unique
          - not_null
      - name: team_id
        tests:
          - not_null
      - name: team_attribute_pk
        tests:
          - not_null
